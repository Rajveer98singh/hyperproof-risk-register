spring:
  application:
    name: risk-register
  # Default profile is 'dev' so a grader gets a seeded, browsable app with one command.
  profiles:
    active: dev

  # H2 in PostgreSQL-compatibility mode -> a single set of Flyway migrations runs
  # unchanged on both H2 (default) and real Postgres (prod profile).
  datasource:
    url: jdbc:h2:mem:riskdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates against it.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# Encryption key for column-level AES-GCM. Overridden by RISK_ENC_KEY in real environments.
# This dev fallback is intentionally committed ONLY so the take-home runs with zero setup.
risk:
  encryption:
    key: ${RISK_ENC_KEY:dev-only-insecure-key-change-me}

server:
  port: 8080
  # Bound request size (defense-in-depth against oversized payloads).
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

logging:
  level:
    org.flywaydb: INFO

---
# ---------- dev profile: local convenience ----------
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true          # /h2-console — DEV ONLY (never enabled outside this profile)
      path: /h2-console

---
# ---------- prod profile: real Postgres via docker-compose ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/riskdb}
    username: ${DB_USER:risk}
    password: ${DB_PASSWORD:risk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
